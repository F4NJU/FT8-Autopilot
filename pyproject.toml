[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wsjtx-autopilot"
dynamic = ["version"]
description = "Windows FT8/FT4 operating assistant for WSJT-X"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5", "pypresence>=4.6,<5"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.6"]
gui = ["PySide6>=6.7"]
build = ["PyInstaller>=6.0"]

[project.scripts]
wsjtx-autopilot = "wsjtx_autopilot.main:main"
wsjtx-autopilot-gui = "wsjtx_autopilot.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "wsjtx_autopilot.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
