[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wsjtx-autopilot"
version = "0.1.0"
description = "Dry-run FT8 decision companion for WSJT-X"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
gui = ["PySide6>=6.7"]
build = ["PyInstaller>=6.0"]

[project.scripts]
wsjtx-autopilot = "wsjtx_autopilot.main:main"
wsjtx-autopilot-gui = "wsjtx_autopilot.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
